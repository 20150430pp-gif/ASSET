<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이대서울병원 장비점검</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif; background: #000; }
        #camera-container { position: fixed; inset: 0; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8); }

        /* ===== 스티커 카드 ===== */
        .sticker {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; width: 92%; max-width: 480px;
            background: #fff;                 /* 스티커 바깥 흰 여백 */
            padding: 7px;
            border-radius: 12px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -45%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        .sticker-inner {
            display: flex;
            border: 2px solid #111;           /* 검정 테두리 */
            border-radius: 3px;
            overflow: hidden;
        }

        /* 왼쪽 초록 영역 */
        .left { flex: 1; background: #2e8b2e; padding: 6px 6px 8px; display: flex; flex-direction: column; min-width: 0; }
        .title {
            color: #fff; font-weight: 800; text-align: center;
            font-size: clamp(17px, 5.4vw, 24px); letter-spacing: -0.5px;
            padding: 8px 4px 10px; white-space: nowrap;
        }
        .row {
            background: #fff; color: #111;
            display: flex; align-items: center;
            padding: 6px 8px; margin-top: 4px;
            font-size: clamp(14px, 4.2vw, 18px); font-weight: 700;
            white-space: nowrap;
        }
        .row .lbl { width: 3.6em; text-align: justify; text-align-last: justify; flex-shrink: 0; }
        .row .colon { margin: 0 4px 0 2px; }
        .row .val { overflow: hidden; text-overflow: ellipsis; font-weight: 600; }

        /* L·N 등급: 초록 영역 칸 조정 */
        .sticker.repair .row { padding: 6px 6px; }
        .sticker.repair .row .lbl {
            width: 4.8em; font-size: 0.92em; letter-spacing: -1px;
        }
        .sticker.repair .row .colon { margin: 0 3px 0 2px; }
        .sticker.repair .row .val { letter-spacing: -0.3px; }
        /* '당해 수리 발생 없음' 문구: 한 줄 유지 */
        .row .val.small {
            font-size: clamp(11px, 3.3vw, 14px);
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        /* 오른쪽 흰 칸 (위험등급) */
        .right {
            width: 34%; background: #fff;
            border-left: 2px solid #111;
            display: flex; align-items: center; justify-content: center;
            padding: 6px;
        }
        .risk-badge {
            width: 100%; aspect-ratio: 1 / 1; max-width: 140px;
            border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff;
        }
        .risk-badge .en { font-size: clamp(44px, 15vw, 68px); font-weight: 900; line-height: 1; }
        .risk-badge .ko { font-size: clamp(16px, 5vw, 22px); font-weight: 800; margin-top: 4px; }

        /* 등급별 색상 (기존 유지) */
        .bg-h { background: #e74c3c; box-shadow: 0 0 14px rgba(231, 76, 60, 0.45); }
        .bg-m { background: #f39c12; box-shadow: 0 0 14px rgba(243, 156, 18, 0.45); }
        .bg-l { background: #3498db; box-shadow: 0 0 14px rgba(52, 152, 219, 0.45); }
        .bg-n { background: #2ecc71; box-shadow: 0 0 14px rgba(46, 204, 113, 0.45); }
        .bg-none { background: transparent; border: 2px dashed #bbb; color: #aaa; }
    </style>
</head>
<body>
    <div id="camera-container"><video id="webcam" autoplay playsinline></video></div>

    <div id="ar-view" class="sticker" style="display: none;">
        <div class="sticker-inner">
            <div class="left">
                <div class="title">이대서울병원 장비점검</div>
                <div class="row"><span class="lbl">점검자</span><span class="colon">:</span><span id="v-user" class="val"></span></div>
                <div class="row"><span class="lbl" id="l-date">점검일</span><span class="colon">:</span><span id="v-date" class="val"></span></div>
            </div>
            <div class="right">
                <div id="risk-badge" class="risk-badge bg-none">
                    <span id="risk-en" class="en">-</span>
                    <span id="risk-ko" class="ko"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-ztRbBeM4lLwnzXHb1zymeO11NYxFRcCy_KYH90dkD5nZjZlqRvRfgm4QzQyH02nFVZqqXfiGAcwr/pub?gid=1860433038&single=true&output=csv';

        const BLANK_DATE = '20\u2003\u2003.\u2003\u2003.';   // 스티커처럼 빈칸 표시
        const NO_REPAIR = '당해 수리 발생 없음';

        const RISK = {
            'H': { en: 'H', ko: '높음', cls: 'bg-h' },
            'M': { en: 'M', ko: '중간', cls: 'bg-m' },
            'L': { en: 'L', ko: '낮음', cls: 'bg-l' },
            'N': { en: 'N', ko: '없음', cls: 'bg-n' }
        };

        // 따옴표 안의 쉼표까지 처리하는 CSV 파서
        function parseCSV(text) {
            const rows = []; let row = []; let cell = ''; let q = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (q) {
                    if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
                    else if (c === '"') q = false;
                    else cell += c;
                } else if (c === '"') q = true;
                else if (c === ',') { row.push(cell.trim()); cell = ''; }
                else if (c === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
                else if (c !== '\r') cell += c;
            }
            row.push(cell.trim()); rows.push(row);
            return rows;
        }

        // "2026-11-10", "2026.11.10", "2026. 11. 10" 등 → Date
        function toDate(s) {
            const m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
            return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
        }
        function fmt(d) {
            if (!d) return BLANK_DATE;
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}. ${p(d.getMonth() + 1)}. ${p(d.getDate())}.`;
        }

        async function startApp() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) { console.error('카메라 오류', err); }

            try {
                const targetID = new URLSearchParams(window.location.search).get('id');
                if (!targetID) return;

                const res = await fetch(CSV_URL);
                const rows = parseCSV(await res.text());
                const data = rows.find(r => String(r[0]) === String(targetID));
                if (!data) return;

                const view = document.getElementById('ar-view');
                view.style.display = 'block';

                // 점검자 (I열), 비어 있으면 '의공팀'
                document.getElementById('v-user').innerText = data[8] || '의공팀';

                // 위험등급 (F열)
                const riskKey = (data[5] || '').trim().toUpperCase();
                const r = RISK[riskKey];
                const isRepair = riskKey === 'L' || riskKey === 'N';

                const badge = document.getElementById('risk-badge');
                badge.className = 'risk-badge ' + (r ? r.cls : 'bg-none');
                document.getElementById('risk-en').innerText = r ? r.en : '-';
                document.getElementById('risk-ko').innerText = r ? r.ko : '';

                // 날짜 (H열): H·M → 점검일 / L·N → 최근수리일
                const lDate = document.getElementById('l-date');
                const vDate = document.getElementById('v-date');
                const d = toDate(data[7]);

                view.classList.toggle('repair', isRepair);
                lDate.innerText = isRepair ? '최근수리일' : '점검일';

                if (isRepair && !d) {
                    vDate.innerText = NO_REPAIR;
                    vDate.classList.add('small');
                } else {
                    vDate.innerText = fmt(d);
                    vDate.classList.remove('small');
                }
            } catch (err) { console.error(err); }
        }
        startApp();
    </script>
</body>
</html>
