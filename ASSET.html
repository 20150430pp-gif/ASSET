<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이대서울병원 의료장비 점검</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --brand: #00573f;          /* 이대서울병원 그린 */
            --brand-dark: #003d2c;
            --ink: #14201b;
            --muted: #7b8a84;
            --line: #e6ebe9;
        }
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
            background: #000; -webkit-font-smoothing: antialiased;
        }
        #camera-container { position: fixed; inset: 0; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75); }

        /* ===== 카드 ===== */
        .card {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; width: 90%; max-width: 440px;
            background: #fff; border-radius: 20px; overflow: hidden;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
            animation: rise 0.45s cubic-bezier(.2, .8, .2, 1);
        }
        @keyframes rise {
            from { opacity: 0; transform: translate(-50%, -44%); }
            to   { opacity: 1; transform: translate(-50%, -50%); }
        }

        /* 헤더: 병원명 */
        .head {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
            color: #fff; padding: 16px 20px 16px;
        }
        .head .en {
            font-size: clamp(10px, 2.9vw, 12px); font-weight: 500; letter-spacing: 0.1px;
            opacity: 0.72; margin-bottom: 5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;   /* 항상 한 줄 */
        }
        .head .ko { font-size: 21px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; white-space: nowrap; }

        /* 본문 */
        .body { display: flex; }
        .info { flex: 1; min-width: 0; padding: 6px 20px; }
        .field { padding: 14px 0; }
        .field + .field { border-top: 1px solid var(--line); }
        .field .label {
            font-size: 11.5px; font-weight: 600; color: var(--muted);
            letter-spacing: 0.2px; margin-bottom: 6px;
        }
        .field .value {
            font-size: 19px; font-weight: 700; color: var(--ink);
            letter-spacing: -0.4px; font-variant-numeric: tabular-nums;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .field .value.note { font-size: 16px; color: var(--brand); }

        /* 위험등급 패널 */
        .risk {
            width: 36%; margin: 14px 14px 14px 0; border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; padding: 14px 8px; text-align: center;
        }
        .risk .cap {
            font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
            opacity: 0.85; margin-bottom: 10px;
        }
        .risk .grade, .risk .grade-ko {
            font-size: clamp(26px, 8.5vw, 34px);    /* 영문·한글 같은 크기 */
            font-weight: 800; line-height: 1.15; letter-spacing: -0.5px;
        }

        .bg-h { background: linear-gradient(160deg, #ef5a4a, #c0392b); }
        .bg-m { background: linear-gradient(160deg, #f7a531, #d9860a); }
        .bg-l { background: linear-gradient(160deg, #4aa3e0, #2878b8); }
        .bg-n { background: linear-gradient(160deg, #3ccf7e, #22a35d); }
        .bg-none { background: #f3f5f4; color: #a3aeaa; border: 1px dashed #cfd6d3; }

        /* 푸터 */
        .foot {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 20px; background: #f6f8f7; border-top: 1px solid var(--line);
            font-size: 11px; color: var(--muted); font-weight: 500;
        }
        .foot .live { display: flex; align-items: center; gap: 6px; }
        .foot .dot {
            width: 7px; height: 7px; border-radius: 50%; background: #22a35d;
            box-shadow: 0 0 0 3px rgba(34, 163, 93, 0.18);
        }
    </style>
</head>
<body>
    <div id="camera-container"><video id="webcam" autoplay playsinline></video></div>

    <div id="ar-view" class="card" style="display: none;">
        <div class="head">
            <div class="en">Ewha Womans University Seoul Hospital</div>
            <div class="ko">이대서울병원</div>
        </div>

        <div class="body">
            <div class="info">
                <div class="field">
                    <div class="label">점검자</div>
                    <div id="v-user" class="value"></div>
                </div>
                <div class="field">
                    <div id="l-date" class="label">점검일</div>
                    <div id="v-date" class="value"></div>
                </div>
            </div>
            <div id="risk" class="risk bg-none">
                <div class="cap">위험등급</div>
                <div id="risk-en" class="grade">-</div>
                <div id="risk-ko" class="grade-ko"></div>
            </div>
        </div>

        <div class="foot">
            <span>의공팀 Medical Engineering</span>
            <span class="live"><span class="dot"></span><span id="v-now"></span></span>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-ztRbBeM4lLwnzXHb1zymeO11NYxFRcCy_KYH90dkD5nZjZlqRvRfgm4QzQyH02nFVZqqXfiGAcwr/pub?gid=1860433038&single=true&output=csv';

        const BLANK_DATE = '20\u2003\u2003.\u2003\u2003.';
        const NO_HISTORY = '당해 점검 이력 없음';

        const RISK = {
            'H': { en: 'H', ko: '높음', cls: 'bg-h' },
            'M': { en: 'M', ko: '중간', cls: 'bg-m' },
            'L': { en: 'L', ko: '낮음', cls: 'bg-l' },
            'N': { en: 'N', ko: '없음', cls: 'bg-n' }
        };

        function parseCSV(text) {
            const rows = []; let row = []; let cell = ''; let q = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (q) {
                    if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
                    else if (c === '"') q = false;
                    else cell += c;
                } else if (c === '"') q = true;
                else if (c === ',') { row.push(cell.trim()); cell = ''; }
                else if (c === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
                else if (c !== '\r') cell += c;
            }
            row.push(cell.trim()); rows.push(row);
            return rows;
        }

        function toDate(s) {
            const m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
            return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
        }
        const p = n => String(n).padStart(2, '0');
        function fmt(d) {
            if (!d) return BLANK_DATE;
            return `${d.getFullYear()}. ${p(d.getMonth() + 1)}. ${p(d.getDate())}.`;
        }

        async function startApp() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) { console.error('카메라 오류', err); }

            try {
                const targetID = new URLSearchParams(window.location.search).get('id');
                if (!targetID) return;

                const res = await fetch(CSV_URL);
                const rows = parseCSV(await res.text());
                const data = rows.find(r => String(r[0]) === String(targetID));
                if (!data) return;

                document.getElementById('ar-view').style.display = 'block';

                // 조회 시각
                const now = new Date();
                document.getElementById('v-now').innerText =
                    `실시간 조회 ${now.getFullYear()}.${p(now.getMonth() + 1)}.${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`;

                // 점검자 (I열)
                document.getElementById('v-user').innerText = data[8] || '의공팀';

                // 위험등급 (F열)
                const key = (data[5] || '').trim().toUpperCase();
                const r = RISK[key];
                const isLowRisk = key === 'L' || key === 'N';

                document.getElementById('risk').className = 'risk ' + (r ? r.cls : 'bg-none');
                document.getElementById('risk-en').innerText = r ? r.en : '-';
                document.getElementById('risk-ko').innerText = r ? r.ko : '';

                // 날짜 (H열): H·M → 점검일 / L·N → 최근점검일
                const d = toDate(data[7]);
                const vDate = document.getElementById('v-date');
                document.getElementById('l-date').innerText = isLowRisk ? '최근점검일' : '점검일';

                if (isLowRisk && !d) {
                    vDate.innerText = NO_HISTORY;
                    vDate.classList.add('note');
                } else {
                    vDate.innerText = fmt(d);
                    vDate.classList.remove('note');
                }
            } catch (err) { console.error(err); }
        }
        startApp();
    </script>
</body>
</html>
