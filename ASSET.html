<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Asset HUD</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Orbitron', sans-serif; }
        #camera-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7) contrast(1.2); }

        /* HUD 레이아웃 */
        .hud-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; width: 90%; display: flex; flex-direction: column; align-items: center;
            gap: 20px; pointer-events: none;
        }

        .device-title {
            color: #00f2ff; text-shadow: 0 0 10px #00f2ff; font-size: 1.5em; font-weight: bold;
            margin-bottom: 10px; text-align: center; border-bottom: 2px solid #00f2ff; padding-bottom: 5px;
        }

        .cards-container { display: flex; gap: 15px; width: 100%; justify-content: center; }

        /* 신박한 카드 디자인 */
        .hud-card {
            flex: 1; max-width: 160px; height: 160px;
            background: rgba(0, 20, 30, 0.6);
            border: 2px solid #00f2ff; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        .hud-card.risk { border-color: var(--risk-color); box-shadow: 0 0 20px var(--risk-shadow); }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .card-label { font-size: 0.8em; color: rgba(255,255,255,0.7); margin-bottom: 10px; }
        .card-value { font-size: 1.6em; font-weight: 900; text-align: center; }

        /* 등급별 색상 정의 */
        :root { --risk-color: #00f2ff; --risk-shadow: rgba(0, 242, 255, 0.3); }
        .status-ok { color: #00ff88; text-shadow: 0 0 10px #00ff88; }
        .status-warn { color: #ff3c00; text-shadow: 0 0 10px #ff3c00; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="camera-container"><video id="webcam" autoplay playsinline></video></div>

    <div class="hud-wrapper" id="hud" style="display: none;">
        <div class="device-title" id="asset-name">SCANNING...</div>
        
        <div class="cards-container">
            <div class="hud-card">
                <div class="card-label">INSPECTION</div>
                <div id="status-val" class="card-value">WAIT</div>
            </div>

            <div id="risk-card" class="hud-card risk">
                <div class="card-label">RISK LEVEL</div>
                <div id="risk-val" class="card-value">-</div>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-ztRbBeM4lLwnzXHb1zymeO11NYxFRcCy_KYH90dkD5nZjZlqRvRfgm4QzQyH02nFVZqqXfiGAcwr/pub?gid=1860433038&single=true&output=csv';

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('webcam').srcObject = stream;
        }

        async function loadData() {
            const params = new URLSearchParams(window.location.search);
            const assetID = params.get('asset');
            if (!assetID) return;

            const res = await fetch(CSV_URL);
            const text = await res.text();
            const rows = text.split('\n').map(r => r.split(',').map(c => c.trim()));
            const header = rows[0];
            const data = rows.find(r => r[0] === assetID);

            if (data) {
                document.getElementById('hud').style.display = 'flex';
                document.getElementById('asset-name').innerText = data[3]; // 품명
                
                // 점검 상태 로직 (점검일 기준)
                const statusVal = document.getElementById('status-val');
                if (data[6] !== '-') {
                    statusVal.innerText = "DONE";
                    statusVal.className = "card-value status-ok";
                } else {
                    statusVal.innerText = "MISS";
                    statusVal.className = "card-value status-warn";
                }

                // 위험 등급 로직 (H, M, L, N) - 엑셀의 '위험등급' 열 번호를 확인하세요.
                // 아래 [4]는 예시입니다. 엑셀에서 위험등급이 몇번째 칸인지 세어보고 숫자를 바꾸세요.
                const risk = data[4]; 
                const riskVal = document.getElementById('risk-val');
                const riskCard = document.getElementById('risk-card');
                
                let color = "#00ff88"; // 기본 N (초록)
                if (risk === 'H') color = "#ff0044"; // 빨강
                else if (risk === 'M') color = "#ffcc00"; // 노랑
                else if (risk === 'L') color = "#00ccff"; // 파랑

                riskVal.innerText = risk;
                riskVal.style.color = color;
                riskVal.style.textShadow = `0 0 10px ${color}`;
                riskCard.style.setProperty('--risk-color', color);
                riskCard.style.setProperty('--risk-shadow', color + '44');
            }
        }

        startCamera();
        loadData();
    </script>
</body>
</html>
