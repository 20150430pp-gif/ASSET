<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의료장비 점검 현황</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { background-color: #fff; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); padding: 30px; max-width: 500px; width: 100%; text-align: center; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { color: #007bff; margin-bottom: 25px; font-size: 1.8em; font-weight: 600; }
        .info-item { text-align: left; margin-bottom: 15px; padding: 10px 0; border-bottom: 1px solid #eee; }
        .info-item:last-child { border-bottom: none; margin-bottom: 0; }
        .label { font-weight: bold; color: #555; margin-bottom: 5px; display: block; font-size: 0.9em; }
        .value { font-size: 1.1em; color: #000; word-break: break-all; }
        .status { font-size: 1.5em; font-weight: bold; margin-top: 20px; padding: 10px; border-radius: 8px; color: #fff; }
        .status.completed { background-color: #28a745; } /* Green */
        .status.pending { background-color: #ffc107; color: #333; } /* Yellow */
        .status.overdue { background-color: #dc3545; } /* Red */
        .loading { font-size: 1.1em; color: #666; margin-top: 20px; }
        .error { color: #dc3545; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>의료장비 점검 현황</h1>
        <div id="asset-info">
            <p class="loading">정보를 불러오는 중...</p>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-ztRbBeM4lLwnzXHb1zymeO11NYxFRcCy_KYH90dkD5nZjZlqRvRfgm4QzQyH02nFVZqqXfiGAcwr/pub?gid=1860433038&single=true&output=csv'; // ✨1단계에서 복사한 CSV 링크를 여기에 넣습니다✨
        
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const assetNumber = params.get('asset'); // URL에서 asset=H5D012000004를 찾습니다.

            if (!assetNumber) {
                document.getElementById('asset-info').innerHTML = '<p class="error">자산번호가 URL에 없습니다.</p>';
                return;
            }

            fetch(CSV_URL)
                .then(response => response.text())
                .then(csvText => {
                    const lines = csvText.split('\n');
                    const headers = lines[0].split(',').map(h => h.trim()); // 헤더 파싱
                    
                    let foundAsset = null;
                    for (let i = 1; i < lines.length; i++) {
                        const data = lines[i].split(',').map(d => d.trim());
                        if (data[0] === assetNumber) { // 첫 번째 열(자산번호)과 매칭
                            foundAsset = {};
                            headers.forEach((header, index) => {
                                foundAsset[header] = data[index] || '-'; // 데이터가 없으면 '-' 표시
                            });
                            break;
                        }
                    }

                    const infoDiv = document.getElementById('asset-info');
                    if (foundAsset) {
                        const today = new Date();
                        const inspectionDateStr = foundAsset['점검일']; // '점검일' 헤더 사용
                        const inspectionDate = inspectionDateStr !== '-' ? new Date(inspectionDateStr) : null;
                        
                        let statusClass = 'pending';
                        let statusText = '미점검';

                        if (inspectionDate) {
                            const oneYearLater = new Date(inspectionDate);
                            oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);

                            if (today < oneYearLater) {
                                statusClass = 'completed';
                                statusText = '점검 완료';
                            } else {
                                statusClass = 'overdue';
                                statusText = '점검 기한 초과';
                            }
                        }

                        infoDiv.innerHTML = `
                            <div class="status ${statusClass}">${statusText}</div>
                            <div class="info-item"><span class="label">자산번호</span><span class="value">${foundAsset['자산번호']}</span></div>
                            <div class="info-item"><span class="label">장비명</span><span class="value">${foundAsset['품명']}</span></div>
                            <div class="info-item"><span class="label">사용 부서</span><span class="value">${foundAsset['사용부서(자산)']}</span></div>
                            <div class="info-item"><span class="label">최근 점검일</span><span class="value">${foundAsset['점검일']}</span></div>
                            <div class="info-item"><span class="label">점검 주체</span><span class="value">${foundAsset['점검자']}</span></div>
                        `;
                    } else {
                        infoDiv.innerHTML = `<p class="error">자산번호 ${assetNumber}를 찾을 수 없습니다.</p>`;
                    }
                })
                .catch(error => {
                    console.error('Error fetching CSV:', error);
                    document.getElementById('asset-info').innerHTML = '<p class="error">데이터를 불러오는 데 실패했습니다.</p>';
                });
        });
    </script>
</body>
</html>
